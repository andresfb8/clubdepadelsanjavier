<section class="alumnos">
  <div class="alumnos__card" data-reveal>
    <span class="badge badge--ghost-dark">Área privada</span>
    <h1 class="display-sm">Tu pádel, en orden.</h1>
    <p class="lede">Reservas, grupo, avisos y pagos en un solo sitio. Solo para alumnos del club.</p>

    <form class="form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="tu@email.com" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
      </div>
      <button class="btn btn--primary btn--block" type="submit">
        Entrar
        <span class="btn__icon"><svg class="i" aria-hidden="true"><use href="#i-arrow"/></svg></span>
      </button>
    </form>

    <p class="alumnos__help">¿Primera vez o has olvidado la contraseña? <a href="%%WA_ALUMNO%%" target="_blank" rel="noopener">Pídenos acceso por WhatsApp</a></p>
    <p class="alumnos__aside">¿Todavía no eres alumno? <a href="index.html">Vuelve a la web y reserva una clase</a></p>
  </div>
</section>
